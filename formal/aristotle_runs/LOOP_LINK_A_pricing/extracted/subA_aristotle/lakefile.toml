name = "V3Maps"
defaultTargets = ["BOOK_FORMAL", "MAP_FORMAL", "BASIS_FORMAL", "LINK_PRICING"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.28.0"

[[lean_lib]]
name = "BOOK_FORMAL"
globs = ["BOOK_FORMAL"]

[[lean_lib]]
name = "MAP_FORMAL"
globs = ["MAP_FORMAL"]

[[lean_lib]]
name = "BASIS_FORMAL"
globs = ["BASIS_FORMAL"]

[[lean_lib]]
name = "LINK_PRICING"
globs = ["LINK_PRICING"]
