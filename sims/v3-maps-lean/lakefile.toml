# The maps from the perp book to the option books across strikes — and ONLY these.
# BASIS_FORMAL imports MAP_FORMAL imports BOOK_FORMAL; each is a self-contained
# Lean 4 library over Mathlib. Nothing else from the parent project is included.
name = "V3Maps"
defaultTargets = ["BOOK_FORMAL", "MAP_FORMAL", "BASIS_FORMAL"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.28.0"

[[lean_lib]]
name = "BOOK_FORMAL"
globs = ["BOOK_FORMAL"]

[[lean_lib]]
name = "MAP_FORMAL"
globs = ["MAP_FORMAL"]

[[lean_lib]]
name = "BASIS_FORMAL"
globs = ["BASIS_FORMAL"]
